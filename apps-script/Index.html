<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Kas RT 01 / RW 01</title><style>:root{--nav:#0f172a;--blue:#2563eb;--green:#059669;--red:#dc2626;--bg:#f4f6f9;--line:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a}.top{background:var(--nav);color:white;padding:16px}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:white;color:var(--nav);display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{display:block;font-size:16px}.brand small{color:#cbd5e1}.server{font-size:12px;color:#cbd5e1}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.hero h1{font-size:26px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:white}.dark{background:var(--nav);color:white}.light{background:white;border:1px solid var(--line)}.green{background:var(--green);color:white}.red{background:#fff1f2;color:#be123c}.cards{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:19px}.balance{background:linear-gradient(135deg,#0f172a,#26354d);color:white;border:0}.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;font-weight:800}.amount{font-size:31px;font-weight:850;margin:7px 0}.verify{font-size:11px;color:#bbf7d0}.value{font-size:22px;font-weight:850;margin-top:7px}.in{color:var(--green)}.out{color:var(--red)}.section{margin-top:15px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:17px;margin:0}.head small{color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;background:white}.field textarea{min-height:75px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f9;padding:5px;border-radius:11px}.seg button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:750}.seg .active{background:#dcfce7;color:#047857}.tablebox{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid #eef2f6;white-space:nowrap}.pill{padding:4px 7px;border-radius:99px;background:#dcfce7;color:#047857;font-size:10px;font-weight:800}.notice{padding:12px;border-radius:10px;margin:10px 0;font-size:13px}.info{background:#eff6ff;color:#1d4ed8}.success{background:#ecfdf5;color:#047857}.error{background:#fff1f2;color:#be123c}.bottom{display:none}.version{font-size:10px;color:#94a3b8;margin-top:12px}@media(max-width:720px){body{padding-bottom:70px}.top{padding:12px 14px}.topin{align-items:flex-start}.server{display:none}.wrap{padding:14px}.hero{display:block}.hero h1{font-size:23px}.actions{margin-top:13px}.actions .btn{flex:1}.cards{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}.amount{font-size:28px}.value{font-size:18px}.card{padding:16px}.form{grid-template-columns:1fr}.full{grid-column:auto}.table th:nth-child(4),.table td:nth-child(4){display:none}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:white;color:var(--muted);font-size:10px;font-weight:750}.bottom span{display:block;font-size:19px;margin-bottom:2px}}</style></head><body><header class="top"><div class="topin"><div class="brand"><div class="logo">RT</div><div><b>Kas RT 01 / RW 01</b><small>Dukuh Gudang · Desa Surorejan</small></div></div><div class="server" id="server">Menghubungkan…</div></div></header><main class="wrap"><div id="app"><section class="card"><b>Memuat aplikasi…</b><div class="version">UI build 2026.08.20.09</div></section></div></main><nav class="bottom"><button onclick="go('dash')"><span>⌂</span>Beranda</button><button onclick="go('form')"><span>＋</span>Transaksi</button><button onclick="go('history')"><span>▤</span>Riwayat</button><button onclick="report()"><span>◫</span>Laporan</button></nav><script>var jenis='Pemasukan';function $(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function rpc(fn){var args=[].slice.call(arguments,1);return new Promise(function(resolve,reject){var done=false,t=setTimeout(function(){if(!done){done=true;reject(new Error('Timeout '+fn))}},15000);var runner=google.script.run.withSuccessHandler(function(r){if(done)return;done=true;clearTimeout(t);resolve(r)}).withFailureHandler(function(e){if(done)return;done=true;clearTimeout(t);reject(new Error(e&&e.message?e.message:String(e)))});runner[fn].apply(runner,args)})}function go(id){var e=$(id);if(e)e.scrollIntoView({behavior:'smooth'})}async function boot(){try{var v=await rpc('testBackend');$('server').textContent='● Database tersambung · '+v.version;var d=await rpc('initialData');if(!d||d.success!==true)throw new Error('Data server tidak valid');render(d)}catch(e){$('server').textContent='● Server error';$('app').innerHTML='<div class="notice error"><b>Gagal memuat aplikasi</b><br>'+esc(e.message)+'</div><div class="card"><b>Diagnostik</b><div class="version">UI build 2026.08.20.09</div></div>'}}function render(d){var x=d.dashboard,t=d.transactions||[];var rows=t.map(function(a){return '<tr><td><b>'+esc(a.id)+'</b></td><td>'+esc(a.tanggal)+'</td><td>'+esc(a.jenis)+'</td><td>'+esc(a.kategori)+'</td><td>'+esc(a.keterangan)+'</td><td class="'+(a.jenis==='Pemasukan'?'in':'out')+'">'+(a.jenis==='Pemasukan'?'+':'−')+' '+rp(a.nominal)+'</td><td><span class="pill">'+esc(a.status)+'</span></td></tr>'}).join('');$('app').innerHTML='<section id="dash" class="hero"><div><h1>Dashboard Kas</h1><p>Administrasi kas RT yang terhubung langsung ke Google Sheets.</p></div><div class="actions"><button class="btn primary" onclick="setJenis(\'Pemasukan\');go(\'form\')">＋ Pemasukan</button><button class="btn light" onclick="setJenis(\'Pengeluaran\');go(\'form\')">− Pengeluaran</button></div></section><section class="cards"><div class="card balance"><div class="label">Saldo Saat Ini</div><div class="amount">'+rp(x.saldo)+'</div><div class="verify">✓ Dihitung & dikonfirmasi server</div></div><div class="card"><div class="label">Total Pemasukan</div><div class="value in">'+rp(x.pemasukan)+'</div></div><div class="card"><div class="label">Total Pengeluaran</div><div class="value out">'+rp(x.pengeluaran)+'</div></div></section><section id="form" class="card section"><div class="head"><div><h2>Tambah Transaksi</h2><small>Data disimpan langsung ke server.</small></div></div><form id="txform" class="form"><div class="field full"><label>Jenis Transaksi</label><div class="seg"><button id="bi" type="button" class="active" onclick="setJenis(\'Pemasukan\')">↑ Pemasukan</button><button id="bo" type="button" onclick="setJenis(\'Pengeluaran\')">↓ Pengeluaran</button></div></div><div class="field"><label>Tanggal</label><input id="tgl" type="date" required></div><div class="field"><label>Waktu</label><input id="wkt" type="time" required></div><div class="field"><label>Kategori</label><input id="kat" value="Lainnya" required></div><div class="field"><label>Nominal</label><input id="nom" type="number" min="1" required></div><div class="field full"><label>Keterangan</label><input id="ket" required placeholder="Contoh: Iuran warga Agustus"></div><div class="field full"><label>Catatan</label><textarea id="cat"></textarea></div><div class="full"><button id="save" class="btn primary" style="width:100%" type="submit">💾 Simpan & Verifikasi</button></div></form><div id="msg"></div></section><section id="history" class="card section"><div class="head"><div><h2>Riwayat Transaksi</h2><small>'+x.jumlahTransaksi+' transaksi aktif</small></div><button class="btn light" onclick="boot()">↻ Refresh</button></div><div class="tablebox"><table class="table"><thead><tr><th>ID</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Status</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7">Belum ada transaksi</td></tr>')+'</tbody></table></div></section><section class="card section"><div class="head"><div><h2>Laporan & Berbagi</h2><small>Ringkasan kas siap dibagikan.</small></div></div><div class="actions"><button class="btn green" onclick="shareWA()">WhatsApp</button><button class="btn light" onclick="report()">Laporan</button></div></section><div class="version">UI build 2026.08.20.09 · Sumber data: server, bukan cache browser.</div>';var n=new Date();$('tgl').value=n.toISOString().slice(0,10);$('wkt').value=n.toTimeString().slice(0,5);$('txform').addEventListener('submit',saveTx)}function setJenis(v){jenis=v;if($('bi')){$('bi').className=v==='Pemasukan'?'active':'';$('bo').className=v==='Pengeluaran'?'active':''}}async function saveTx(e){e.preventDefault();var b=$('save'),m=$('msg');b.disabled=true;b.textContent='Menyimpan…';m.innerHTML='<div class="notice info">Menyimpan dan memverifikasi transaksi…</div>';try{var r=await rpc('createTransaction',{tanggal:$('tgl').value,waktu:$('wkt').value,jenis:jenis,kategori:$('kat').value,nominal:Number($('nom').value),keterangan:$('ket').value,catatan:$('cat').value});if(!r||!r.success||!r.id)throw new Error('Server tidak mengembalikan ID transaksi.');m.innerHTML='<div class="notice success">✓ Tersimpan · <b>'+esc(r.id)+'</b> · Saldo '+rp(r.dashboard.saldo)+'</div>';setTimeout(boot,600)}catch(e){m.innerHTML='<div class="notice error">'+esc(e.message)+'<br><small>Jangan klik ulang sebelum status database diperiksa.</small></div>'}finally{b.disabled=false;b.textContent='💾 Simpan & Verifikasi'}}async function shareWA(){try{var r=await rpc('reportSummary');var text='LAPORAN KAS RT 01 RW 01\nDukuh Gudang, Desa Surorejan\nPer Tanggal: '+r.date+'\n\nSaldo Awal: '+rp(r.saldoAwal)+'\nTotal Pemasukan: '+rp(r.pemasukan)+'\nTotal Pengeluaran: '+rp(r.pengeluaran)+'\n-----------------------------------\nSISA SALDO SEKARANG: '+rp(r.saldo)+'\n\nCatatan: Transaksi dicatat secara otomatis via Aplikasi Kas RT.';window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}catch(e){alert(e.message)}}async function report(){try{var r=await rpc('reportSummary');alert('LAPORAN KAS RT 01 / RW 01\n\nSaldo Awal: '+rp(r.saldoAwal)+'\nPemasukan: '+rp(r.pemasukan)+'\nPengeluaran: '+rp(r.pengeluaran)+'\nSaldo Saat Ini: '+rp(r.saldo))}catch(e){alert(e.message)}}boot();</script></body></html>
