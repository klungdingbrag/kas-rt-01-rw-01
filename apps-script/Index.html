<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kas RT 01 / RW 01</title><style>:root{--ink:#142033;--muted:#667085;--line:#e7eaf0;--bg:#f4f7fb;--card:#fff;--green:#087443;--red:#b42318;--blue:#175cd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:700;cursor:pointer}.nav button.active,.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.hero{background:linear-gradient(135deg,#142033,#243654);color:#fff;border-radius:22px;padding:25px;margin-bottom:16px;box-shadow:0 12px 35px rgba(20,32,51,.12)}.hero .eyebrow{font-size:11px;letter-spacing:.12em;opacity:.7}.hero h2{margin:6px 0;font-size:28px}.hero p{margin:0;opacity:.82}.verify{margin-top:14px;font-size:12px;display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.1)}.dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8}.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 16px rgba(16,24,40,.035)}.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}.balance{font-size:30px;font-weight:900;margin:6px 0 4px}.money{font-size:23px;font-weight:900;margin-top:8px}.in{color:var(--green)}.out{color:var(--red)}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h3{margin:0;font-size:17px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;color:#475467;font-weight:700}input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #d9dee8;border-radius:11px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:75px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.notice{padding:11px 13px;border-radius:11px;margin-bottom:12px;background:#eef6ff;color:var(--blue);font-size:13px}.success{background:#ecfdf3;color:#067647}.error{background:#fff1f0;color:var(--red)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #eef0f4;text-align:left;white-space:nowrap;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:var(--green);font-size:11px;font-weight:800}.pill.cancel{background:#fef3f2;color:var(--red)}.row-actions{display:flex;gap:5px}.row-actions button{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.empty{text-align:center;padding:30px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal h3{margin-top:0}.report-box{line-height:1.8;background:#f8fafc;padding:14px;border-radius:12px}.footer{text-align:center;color:#98a2b3;font-size:11px;padding:20px}.version{font-size:10px;color:#98a2b3;margin-top:5px}@media(max-width:850px){.stats,.layout{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wrap{padding:13px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.hero h2{font-size:23px}.balance{font-size:27px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">RT</div><div><h1>Kas RT 01 / RW 01</h1><p>Dukuh Gudang · Desa Surorejan</p></div></div><nav class="nav"><button id="tabDash" class="active" onclick="showTab('dashboard')">Dashboard</button><button id="tabReport" onclick="showTab('report')">Laporan</button><button onclick="openSettings()">⚙ Admin</button></nav></header><section class="hero"><div class="eyebrow">ADMINISTRASI KEUANGAN RT</div><h2 id="locationTitle">RT 01 / RW 01</h2><p id="locationSub">Dukuh Gudang, Desa Surorejan, Kecamatan Puring, Kabupaten Kebumen</p><div class="verify"><span class="dot"></span><span id="serverText">Menghubungkan ke server…</span></div></section><div id="app"><div class="notice">Memuat data kas…</div></div><footer class="footer">Aplikasi Kas RT · Data keuangan dihitung dan dikonfirmasi oleh server<div class="version">UI 2026.08.20.08</div></footer></main><div id="modal" class="modal-bg"><div class="modal"><div id="modalBody"></div></div></div><script>const UI_VERSION='2026.08.20.08';const $=id=>document.getElementById(id);let state=null,currentTab='dashboard';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rpc(fn,...args){return new Promise((resolve,reject)=>{let done=false;const tm=setTimeout(()=>{if(!done){done=true;reject(Error('Timeout: '+fn))}},15000);google.script.run.withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(tm);resolve(r)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(tm);reject(Error(e?.message||e))})[fn](...args)})}function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}async function boot(){try{const v=await rpc('testBackend');$('serverText').textContent='Database tersambung · server '+v.version;const d=await rpc('initialData');if(!d?.success)throw Error('Server tidak mengembalikan data yang valid.');state=d;render();}catch(e){$('serverText').textContent='Koneksi server gagal';$('app').innerHTML='<div class="notice error"><b>Gagal memuat aplikasi</b><br>'+esc(e.message)+'</div>'}}function render(){const c=state.config||{},x=state.dashboard||{};$('locationTitle').textContent=(c.nama_rt||'RT 01')+' / '+(c.nama_rw||'RW 01');$('locationSub').textContent=[c.dukuh,c.desa&&'Desa '+c.desa,c.kecamatan&&'Kecamatan '+c.kecamatan,c.kabupaten&&'Kabupaten '+c.kabupaten].filter(Boolean).join(', ');currentTab==='dashboard'?renderDash():renderReport()}function renderDash(){const x=state.dashboard,t=state.transactions||[];$('app').innerHTML=`<section class="stats"><div class="card"><div class="label">SALDO SAAT INI</div><div class="balance">${money(x.saldo)}</div><span class="pill">✓ Server Verified</span></div><div class="card"><div class="label">TOTAL PEMASUKAN</div><div class="money in">${money(x.pemasukan)}</div><div class="muted">Transaksi aktif</div></div><div class="card"><div class="label">TOTAL PENGELUARAN</div><div class="money out">${money(x.pengeluaran)}</div><div class="muted">Transaksi aktif</div></div></section><section class="layout"><div class="card"><div class="section-title"><h3>Tambah Transaksi</h3><span class="muted">${x.jumlahTransaksi} aktif</span></div><div id="saveNotice"></div><form id="trxForm" class="form"><label>Jenis<select id="jenis"><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select></label><label>Tanggal<input id="tanggal" type="date" required></label><label>Waktu<input id="waktu" type="time" required></label><label>Kategori<input id="kategori" value="Lainnya" required></label><label class="full">Nominal<input id="nominal" type="number" min="1" step="1" required placeholder="Contoh: 50000"></label><label class="full">Keterangan<input id="keterangan" required placeholder="Contoh: Iuran warga bulan Agustus"></label><label class="full">Catatan<textarea id="catatan" placeholder="Opsional"></textarea></label><div class="full actions"><button type="submit" class="btn primary" id="saveBtn">💾 Simpan Transaksi</button></div></form></div><div class="card"><div class="section-title"><h3>Akses Cepat</h3></div><div class="actions" style="justify-content:stretch;flex-direction:column"><button class="btn" onclick="showTab('report')">📊 Lihat Laporan</button><button class="btn" onclick="shareWA()">🟢 Bagikan ke WhatsApp</button><button class="btn" onclick="makePdf()">📄 Export PDF</button><button class="btn" onclick="openSettings()">⚙️ Pengaturan Admin</button></div><div class="report-box" style="margin-top:14px"><b>Saldo Awal</b><br>${money(x.saldoAwal)}<br><b>Jumlah transaksi aktif</b><br>${x.jumlahTransaksi}</div></div></section><section class="card" style="margin-top:14px"><div class="section-title"><h3>Transaksi Terbaru</h3><button class="btn" onclick="boot()">↻ Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${t.length? t.map(rowHtml).join(''):'<tr><td colspan="8" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></section>`;const n=new Date();$('tanggal').value=n.toISOString().slice(0,10);$('waktu').value=n.toTimeString().slice(0,5);$('trxForm').onsubmit=save}function rowHtml(a){return`<tr><td><b>${esc(a.id)}</b></td><td>${esc(a.tanggal)}</td><td class="${a.jenis==='Pemasukan'?'in':'out'}">${a.jenis==='Pemasukan'?'↑':'↓'} ${esc(a.jenis)}</td><td>${esc(a.kategori)}</td><td>${esc(a.keterangan)}</td><td class="${a.jenis==='Pemasukan'?'in':'out'}"><b>${a.jenis==='Pemasukan'?'+':'-'} ${money(a.nominal)}</b></td><td><span class="pill ${a.status!=='AKTIF'?'cancel':''}">${esc(a.status)}</span></td><td>${a.status==='AKTIF'?`<div class="row-actions"><button onclick="editTx('${esc(a.id)}')">✏️</button><button onclick="cancelTx('${esc(a.id)}')">🚫</button></div>`:''}</td></tr>`}async function save(e){e.preventDefault();const b=$('saveBtn'),n=$('saveNotice');b.disabled=true;b.textContent='⏳ Menyimpan…';const data={tanggal:$('tanggal').value,waktu:$('waktu').value,jenis:$('jenis').value,kategori:$('kategori').value.trim(),nominal:Number($('nominal').value),keterangan:$('keterangan').value.trim(),catatan:$('catatan').value.trim()};n.innerHTML='<div class="notice">Menyimpan ke database dan memverifikasi…</div>';try{const r=await rpc('createTransaction',data);if(!r?.success||!r.id)throw Error('Server tidak mengembalikan ID transaksi.');n.innerHTML='<div class="notice success">✓ Tersimpan & diverifikasi · <b>'+esc(r.id)+'</b> · Saldo '+money(r.dashboard.saldo)+'</div>';await new Promise(q=>setTimeout(q,350));state=await rpc('initialData');render()}catch(e){n.innerHTML='<div class="notice error"><b>Gagal menyimpan.</b><br>'+esc(e.message)+'<br><small>Jangan kirim ulang sebelum status database diperiksa.</small></div>'}finally{b.disabled=false;b.textContent='💾 Simpan Transaksi'}}function showTab(tab){currentTab=tab;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$(tab==='dashboard'?'tabDash':'tabReport').classList.add('active');if(state)render()}function shareWA(){const r=state.dashboard,c=state.config||{},d=new Date();const text=`LAPORAN KAS ${c.nama_rt||'RT 01'} ${c.nama_rw||'RW 01'}\n${c.dukuh||'Dukuh Gudang'}, Desa ${c.desa||'Surorejan'}\nPer Tanggal: ${d.toLocaleDateString('id-ID')}\n\nSaldo Awal: ${money(r.saldoAwal)}\nTotal Pemasukan: ${money(r.pemasukan)}\nTotal Pengeluaran: ${money(r.pengeluaran)}\n-----------------------------------\nSISA SALDO SEKARANG: ${money(r.saldo)}\n\nCatatan: Transaksi dicatat secara otomatis via Aplikasi Kas RT.`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}async function makePdf(){try{showModal('<h3>📄 Membuat PDF…</h3><p class="muted">Server sedang menyusun laporan.</p>');const r=await rpc('createReportPdf',{period:'Per Tanggal '+new Date().toLocaleDateString('id-ID')});showModal(`<h3>✓ PDF siap</h3><p class="muted">${esc(r.fileName)}</p><div class="actions"><a class="btn primary" href="${esc(r.url)}" target="_blank">Buka PDF</a><button class="btn" onclick="closeModal()">Tutup</button></div>`)}catch(e){showModal('<h3>Gagal membuat PDF</h3><p class="notice error">'+esc(e.message)+'</p><button class="btn" onclick="closeModal()">Tutup</button>')}}function renderReport(){const x=state.dashboard,c=state.config||{};const text=`LAPORAN KAS ${c.nama_rt||'RT 01'} ${c.nama_rw||'RW 01'}\n${c.dukuh||''}, Desa ${c.desa||''}`;$('app').innerHTML=`<section class="card"><div class="section-title"><div><h3>Laporan Kas</h3><div class="muted">${esc(text)}</div></div><div class="actions"><button class="btn primary" onclick="makePdf()">📄 PDF</button><button class="btn" onclick="shareWA()">🟢 WhatsApp</button></div></div><div class="report-box"><b>Saldo Awal</b><br>${money(x.saldoAwal)}<br><b>Total Pemasukan</b><br><span class="in">${money(x.pemasukan)}</span><br><b>Total Pengeluaran</b><br><span class="out">${money(x.pengeluaran)}</span><hr><b>SISA SALDO SEKARANG</b><br><strong style="font-size:24px">${money(x.saldo)}</strong></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>ID</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th></tr></thead><tbody>${state.transactions.filter(a=>a.status==='AKTIF').map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.tanggal)}</td><td>${esc(a.jenis)}</td><td>${esc(a.kategori)}</td><td>${esc(a.keterangan)}</td><td>${a.jenis==='Pemasukan'?'+':'-'} ${money(a.nominal)}</td></tr>`).join('')}</tbody></table></div></section>`}function showModal(html){$('modalBody').innerHTML=html;$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none'}function editTx(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;showModal(`<h3>✏️ Edit ${esc(id)}</h3><label>Password Admin<input id="mPass" type="password"></label><label>Alasan perubahan<input id="mReason" placeholder="Contoh: salah nominal"></label><label>Nominal<input id="mNom" type="number" value="${t.nominal}"></label><label>Keterangan<input id="mKet" value="${esc(t.keterangan)}"></label><label>Catatan<textarea id="mCat">${esc(t.catatan)}</textarea></label><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="doEdit('${esc(id)}')">Simpan Perubahan</button></div>`)}async function doEdit(id){try{const r=await rpc('updateTransaction',{transactionId:id,password:$('mPass').value,reason:$('mReason').value,data:{tanggal:state.transactions.find(x=>x.id===id).tanggal,waktu:state.transactions.find(x=>x.id===id).waktu,jenis:state.transactions.find(x=>x.id===id).jenis,kategori:state.transactions.find(x=>x.id===id).kategori,nominal:Number($('mNom').value),keterangan:$('mKet').value,catatan:$('mCat').value}});if(!r.success)throw Error('Perubahan gagal.');closeModal();await boot();}catch(e){alert(e.message)}}function cancelTx(id){showModal(`<h3>🚫 Batalkan ${esc(id)}</h3><p>Transaksi tidak dihapus. Status akan menjadi <b>DIBATALKAN</b> dan tidak lagi dihitung dalam saldo.</p><label>Password Admin<input id="mPass" type="password"></label><label>Alasan pembatalan<input id="mReason" placeholder="Wajib diisi"></label><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="doCancel('${esc(id)}')">Batalkan Transaksi</button></div>`)}async function doCancel(id){try{const r=await rpc('cancelTransaction',{transactionId:id,password:$('mPass').value,reason:$('mReason').value});if(!r.success)throw Error('Pembatalan gagal.');closeModal();await boot()}catch(e){alert(e.message)}}function openSettings(){showModal(`<h3>⚙️ Pengaturan Admin</h3><p class="muted">Perubahan pengaturan memerlukan password admin.</p><label>Nama RT<input id="cRT" value="${esc(state?.config?.nama_rt||'RT 01')}"></label><label>Nama RW<input id="cRW" value="${esc(state?.config?.nama_rw||'RW 01')}"></label><label>Dukuh<input id="cDukuh" value="${esc(state?.config?.dukuh||'Dukuh Gudang')}"></label><label>Desa<input id="cDesa" value="${esc(state?.config?.desa||'Surorejan')}"></label><label>Kecamatan<input id="cKec" value="${esc(state?.config?.kecamatan||'Puring')}"></label><label>Kabupaten<input id="cKab" value="${esc(state?.config?.kabupaten||'Kebumen')}"></label><label>Saldo Awal<input id="cSaldo" type="number" value="${Number(state?.dashboard?.saldoAwal||0)}"></label><label>Password Admin<input id="cPass" type="password"></label><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveSettings()">Simpan Pengaturan</button></div>`)}async function saveSettings(){try{const r=await rpc('updateConfig',{password:$('cPass').value,config:{nama_rt:$('cRT').value,nama_rw:$('cRW').value,dukuh:$('cDukuh').value,desa:$('cDesa').value,kecamatan:$('cKec').value,kabupaten:$('cKab').value,saldo_awal:Number($('cSaldo').value)}});if(!r.success)throw Error('Gagal menyimpan pengaturan.');closeModal();await boot()}catch(e){alert(e.message)}}boot();</script></body></html>
