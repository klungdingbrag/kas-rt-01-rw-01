<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kas RT 01 / RW 01</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#172033;color:white;border-radius:20px;padding:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e7eaf0;border-radius:16px;padding:20px}.balance{font-size:32px;font-weight:800}.muted{color:#667085;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:600}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dee8;border-radius:10px;font:inherit}textarea{min-height:80px}button{background:#172033;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.table{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.in{color:#087443}.out{color:#b42318}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf7ef;color:#087443;font-size:12px;font-weight:700}.notice{margin:12px 0;padding:10px;border-radius:10px;background:#eef6ff;color:#175cd3}.error{background:#fff1f0;color:#b42318}.success{background:#ecfdf3;color:#067647}.version{font-size:11px;color:#94a3b8;margin-top:8px}.diagnostic{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;margin-top:8px}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.wrap{padding:14px}.balance{font-size:26px}}</style></head><body><main class="wrap"><section class="hero"><div class="muted" style="color:#cbd5e1">ADMINISTRASI KEUANGAN</div><h1>Kas RT 01 / RW 01</h1><div>Dukuh Gudang · Desa Surorejan · Kecamatan Puring · Kabupaten Kebumen</div><div class="version">UI build 2026.08.20.06 · Server: <span id="serverVersion">memeriksa…</span></div></section><div id="app"><div class="notice">Menghubungkan ke Google Apps Script…</div></div></main><script>const UI_VERSION='2026.08.20.06';const $=id=>document.getElementById(id);let loadTimer=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function timeoutFail(){showError('Timeout','Server tidak menyelesaikan pembacaan data dalam 15 detik. Periksa deployment Web App dan otorisasi Apps Script.')}function rpc(fn,...args){return new Promise((resolve,reject)=>{let finished=false;const timer=setTimeout(()=>{if(!finished){finished=true;reject(Error('Timeout: '+fn+' tidak memberikan respons dalam 15 detik.'))}},15000);google.script.run.withSuccessHandler(r=>{if(finished)return;finished=true;clearTimeout(timer);resolve(r)}).withFailureHandler(e=>{if(finished)return;finished=true;clearTimeout(timer);reject(Error(e&&e.message?e.message:String(e)))} )[fn](...args)})}async function boot(){try{$('app').innerHTML='<div class="notice">Memeriksa koneksi server…</div>';const v=await rpc('testBackend');$('serverVersion').textContent=v&&v.version?v.version:'tidak diketahui';if(!v||v.success!==true)throw Error('Backend tidak memberikan respons valid.');$('app').innerHTML='<div class="notice">Membaca data kas dari Google Sheets…</div>';const d=await rpc('initialData');if(!d||d.success!==true)throw Error('initialData tidak mengembalikan data valid.');render(d)}catch(e){$('serverVersion').textContent='ERROR';showError('Gagal memuat aplikasi',e)}}function showError(title,e){$('app').innerHTML='<div class="notice error"><b>'+esc(title)+'</b><br>'+esc(e&&e.message?e.message:String(e))+'<div class="diagnostic">UI: '+esc(UI_VERSION)+'</div></div>'}function render(d){const x=d.dashboard,t=d.transactions||[];$('app').innerHTML=`<section class="grid"><div class="card"><div class="muted">SALDO SAAT INI</div><div class="balance">Rp ${Number(x.saldo).toLocaleString('id-ID')}</div><div class="status">✓ Dihitung & dikonfirmasi server</div></div><div class="card"><div class="muted">TOTAL PEMASUKAN</div><div class="balance in" style="font-size:24px">Rp ${Number(x.pemasukan).toLocaleString('id-ID')}</div></div><div class="card"><div class="muted">TOTAL PENGELUARAN</div><div class="balance out" style="font-size:24px">Rp ${Number(x.pengeluaran).toLocaleString('id-ID')}</div></div></section><section class="card" style="margin-top:14px"><h2>Tambah Transaksi</h2><div id="saveNotice"></div><form id="transactionForm" class="form"><label>Jenis<select id="jenis"><option>Pemasukan</option><option>Pengeluaran</option></select></label><label>Tanggal<input id="tanggal" type="date" required></label><label>Waktu<input id="waktu" type="time" required></label><label>Kategori<input id="kategori" value="Lainnya" required></label><label>Nominal<input id="nominal" type="number" min="1" step="1" required></label><label>Keterangan<input id="keterangan" required></label><label class="full">Catatan<textarea id="catatan"></textarea></label><div class="full"><button id="saveBtn" type="submit">💾 Simpan ke Database</button></div></form></section><section class="card" style="margin-top:14px"><h2>Transaksi Aktif (${x.jumlahTransaksi})</h2><div class="table"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Status</th></tr></thead><tbody>${t.filter(a=>a.status==='AKTIF').map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.tanggal)}</td><td>${esc(a.jenis)}</td><td>${esc(a.kategori)}</td><td>${esc(a.keterangan)}</td><td class="${a.jenis==='Pemasukan'?'in':'out'}">${a.jenis==='Pemasukan'?'+':'-'} Rp ${Number(a.nominal).toLocaleString('id-ID')}</td><td><span class="status">AKTIF</span></td></tr>`).join('')}</tbody></table></div></section>`;const now=new Date();$('tanggal').value=now.toISOString().slice(0,10);$('waktu').value=now.toTimeString().slice(0,5);$('transactionForm').addEventListener('submit',save)}async function save(e){e.preventDefault();const b=$('saveBtn'),n=$('saveNotice');b.disabled=true;b.textContent='⏳ Menyimpan ke server…';const data={tanggal:$('tanggal').value,waktu:$('waktu').value,jenis:$('jenis').value,kategori:$('kategori').value.trim(),nominal:Number($('nominal').value),keterangan:$('keterangan').value.trim(),catatan:$('catatan').value.trim()};n.innerHTML='<div class="notice">Mengirim transaksi ke Code.gs…</div>';try{const r=await rpc('createTransaction',data);b.disabled=false;b.textContent='💾 Simpan ke Database';if(!r||r.success!==true||!r.id)throw Error('Server merespons tanpa ID transaksi: '+JSON.stringify(r));n.innerHTML='<div class="notice success">✓ Tersimpan & diverifikasi · <b>'+esc(r.id)+'</b> · Saldo Rp '+Number(r.dashboard.saldo).toLocaleString('id-ID')+'</div>';setTimeout(boot,500)}catch(err){b.disabled=false;b.textContent='💾 Simpan ke Database';n.innerHTML='<div class="notice error"><b>Gagal menyimpan.</b><br>'+esc(err.message||err)+'<br><small>Transaksi belum dinyatakan tersimpan. Jangan klik ulang.</small></div>'}}boot();</script></body></html>
