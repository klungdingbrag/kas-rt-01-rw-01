<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Kas RT 01 / RW 01</title><style>
:root{--navy:#0f172a;--blue:#2563eb;--green:#059669;--red:#dc2626;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--shadow:0 8px 28px rgba(15,23,42,.07);--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.app{min-height:100vh}.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 16px rgba(0,0,0,.12)}.topbar-inner{max-width:1180px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:21px;font-weight:900}.brand h1{font-size:17px;margin:0}.brand p{margin:3px 0 0;color:#cbd5e1;font-size:12px}.server{font-size:11px;color:#cbd5e1;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}.container{max-width:1180px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}.hero h2{font-size:27px;margin:0 0 5px;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--navy);color:white}.btn-blue{background:var(--blue);color:#fff}.btn-light{background:#fff;color:var(--text);border:1px solid var(--line)}.btn-green{background:var(--green);color:#fff}.btn-red{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.btn:disabled{opacity:.55;cursor:wait}.cards{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.balance-card{padding:23px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#94a3b8}.balance{font-size:34px;font-weight:850;letter-spacing:-1px;margin:8px 0}.verified{font-size:11px;color:#bbf7d0;display:inline-flex;gap:6px;align-items:center}.stat{padding:21px}.stat .value{font-size:23px;font-weight:800;margin-top:8px}.income{color:var(--green)}.expense{color:var(--red)}.section{margin-top:18px;padding:21px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h3{margin:0;font-size:17px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#334155}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe2ea;background:#fff;border-radius:11px;padding:12px 13px;font:inherit;font-size:14px;outline:none;transition:.15s}.field input:focus,.field select:focus,.field textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.field textarea{min-height:78px;resize:vertical}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#f1f5f9;padding:5px;border-radius:12px}.segmented button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:750;color:var(--muted);cursor:pointer}.segmented button.active-in{background:#dcfce7;color:#047857}.segmented button.active-out{background:#fee2e2;color:#b91c1c}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{padding:10px 12px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);background:#f8fafc}.table td{padding:13px 12px;border-bottom:1px solid #eef2f7;vertical-align:middle}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.pill-active{background:#dcfce7;color:#047857}.pill-cancel{background:#f1f5f9;color:#64748b}.amount-in{color:var(--green);font-weight:800}.amount-out{color:var(--red);font-weight:800}.empty{text-align:center;padding:35px;color:var(--muted)}.notice{padding:11px 13px;border-radius:11px;font-size:13px;margin-bottom:12px}.notice.success{background:#ecfdf5;color:#047857}.notice.error{background:#fff1f2;color:#be123c}.notice.info{background:#eff6ff;color:#1d4ed8}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(3px)}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.22);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.close{border:0;background:#f1f5f9;width:34px;height:34px;border-radius:10px;cursor:pointer}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.bottom-nav{display:none}.version{font-size:10px;color:#94a3b8;margin-top:5px}@media(max-width:760px){body{padding-bottom:76px}.topbar-inner{padding:12px 15px}.brand-icon{width:38px;height:38px}.brand h1{font-size:15px}.brand p{font-size:10px}.server{display:none}.container{padding:15px}.hero{display:block}.hero h2{font-size:23px}.actions{margin-top:14px}.actions .btn{flex:1}.cards{grid-template-columns:1fr 1fr}.balance-card{grid-column:1/-1}.balance{font-size:29px}.stat{padding:16px}.stat .value{font-size:19px}.section{padding:16px;border-radius:16px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table th:nth-child(4),.table td:nth-child(4){display:none}.table th,.table td{padding:11px 8px}.table th:nth-child(1),.table td:nth-child(1){position:sticky;left:0;background:#fff}.bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(12px)}.nav-item{border:0;background:none;color:var(--muted);font-size:10px;font-weight:750;display:flex;flex-direction:column;gap:3px;align-items:center}.nav-item span{font-size:19px}.nav-item.active{color:var(--blue)}}@media(min-width:761px){.mobile-only{display:none}}
</style></head><body><div class="app"><header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-icon">₿</div><div><h1>Kas RT 01 / RW 01</h1><p>Dukuh Gudang · Desa Surorejan</p></div></div><div class="server"><span class="dot"></span><span id="serverStatus">Menghubungkan server…</span></div></div></header><main class="container"><div id="app"><div class="notice info">Memuat data kas…</div></div></main><nav class="bottom-nav"><button class="nav-item active" onclick="scrollToId('dashboard')"><span>⌂</span>Beranda</button><button class="nav-item" onclick="scrollToId('transaksi')"><span>＋</span>Transaksi</button><button class="nav-item" onclick="scrollToId('riwayat')"><span>▤</span>Riwayat</button><button class="nav-item" onclick="openReport()"><span>◫</span>Laporan</button></nav></div><div id="modal" class="modal-backdrop"><div class="modal"><div id="modalContent"></div></div></div><script>
const UI_VERSION='2026.08.20.08';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rpc(fn,...args){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(Error('Timeout: '+fn))}},15000);google.script.run.withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(timer);resolve(r)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(timer);reject(Error(e?.message||String(e)))} )[fn](...args)})}function rupiah(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}async function boot(){try{const v=await rpc('testBackend');$('serverStatus').textContent='Database tersambung · server '+v.version;const d=await rpc('initialData');if(!d?.success)throw Error('Data server tidak valid.');render(d)}catch(e){$('serverStatus').textContent='Server error';$('app').innerHTML='<div class="notice error"><b>Gagal memuat aplikasi</b><br>'+esc(e.message)+'</div>'}}function render(d){const x=d.dashboard,t=d.transactions||[];$('app').innerHTML=`<section id="dashboard" class="hero"><div><h2>Dashboard Kas</h2><p>Ringkasan keuangan RT yang dihitung langsung dari server.</p></div><div class="actions"><button class="btn btn-primary" onclick="openTransaction('Pemasukan')">＋ Pemasukan</button><button class="btn btn-light" onclick="openTransaction('Pengeluaran')">− Pengeluaran</button></div></section><section class="cards"><div class="card balance-card"><div class="eyebrow">Saldo Saat Ini</div><div class="balance">${rupiah(x.saldo)}</div><div class="verified">✓ Dihitung & dikonfirmasi server</div></div><div class="card stat"><div class="eyebrow">Total Pemasukan</div><div class="value income">${rupiah(x.pemasukan)}</div></div><div class="card stat"><div class="eyebrow">Total Pengeluaran</div><div class="value expense">${rupiah(x.pengeluaran)}</div></div></section><section id="transaksi" class="card section"><div class="section-head"><div><h3>Transaksi Baru</h3><p>Catat pemasukan atau pengeluaran kas.</p></div><button class="btn btn-light" onclick="openTransaction('Pemasukan')">＋ Tambah</button></div><form id="quickForm" class="form-grid"><div class="field full"><label>Jenis Transaksi</label><div class="segmented"><button type="button" id="inBtn" class="active-in" onclick="setJenis('Pemasukan')">↑ Pemasukan</button><button type="button" id="outBtn" onclick="setJenis('Pengeluaran')">↓ Pengeluaran</button></div></div><div class="field"><label>Tanggal</label><input id="tanggal" type="date" required></div><div class="field"><label>Waktu</label><input id="waktu" type="time" required></div><div class="field"><label>Kategori</label><input id="kategori" value="Lainnya" required></div><div class="field"><label>Nominal</label><input id="nominal" type="number" min="1" step="1" placeholder="50000" required></div><div class="field full"><label>Keterangan</label><input id="keterangan" placeholder="Contoh: Iuran warga bulan Agustus" required></div><div class="field full"><label>Catatan</label><textarea id="catatan" placeholder="Keterangan tambahan (opsional)"></textarea></div><div class="full"><button class="btn btn-blue" id="saveBtn" type="submit">💾 Simpan & Verifikasi</button></div></form><div id="saveNotice"></div></section><section id="riwayat" class="card section"><div class="section-head"><div><h3>Riwayat Transaksi</h3><p>${x.jumlahTransaksi} transaksi aktif dari database.</p></div><button class="btn btn-light" onclick="boot()">↻ Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${t.length?t.map(a=>`<tr><td><b>${esc(a.id)}</b></td><td>${esc(a.tanggal)}</td><td>${a.jenis==='Pemasukan'?'↑ Masuk':'↓ Keluar'}</td><td>${esc(a.kategori)}</td><td>${esc(a.keterangan)}</td><td class="${a.jenis==='Pemasukan'?'amount-in':'amount-out'}">${a.jenis==='Pemasukan'?'+':'−'} ${rupiah(a.nominal).replace('Rp ','Rp ')}</td><td><span class="pill ${a.status==='AKTIF'?'pill-active':'pill-cancel'}">${esc(a.status)}</span></td><td><button class="btn btn-light" style="padding:7px 9px" onclick='openDetail(${JSON.stringify(a)})'>⋮</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></section><section class="card section" id="laporan"><div class="section-head"><div><h3>Laporan & Berbagi</h3><p>Bagikan ringkasan kas secara cepat.</p></div></div><div class="actions"><button class="btn btn-green" onclick="shareWA()">🟢 WhatsApp</button><button class="btn btn-light" onclick="openReport()">📄 Laporan</button><button class="btn btn-light" onclick="openSettings()">⚙️ Pengaturan</button></div></section><div class="version">UI ${UI_VERSION} · Data bersumber dari server, bukan cache browser.</div>`;const now=new Date();$('tanggal').value=now.toISOString().slice(0,10);$('waktu').value=now.toTimeString().slice(0,5);$('quickForm').addEventListener('submit',save)}let jenis='Pemasukan';function setJenis(v){jenis=v;$('inBtn').className=v==='Pemasukan'?'active-in':'';$('outBtn').className=v==='Pengeluaran'?'active-out':''}function openTransaction(v='Pemasukan'){scrollToId('transaksi');setJenis(v);setTimeout(()=>$('nominal')?.focus(),300)}async function save(e){e.preventDefault();const b=$('saveBtn'),n=$('saveNotice');b.disabled=true;b.textContent='⏳ Menyimpan…';const data={tanggal:$('tanggal').value,waktu:$('waktu').value,jenis,kategori:$('kategori').value.trim(),nominal:Number($('nominal').value),keterangan:$('keterangan').value.trim(),catatan:$('catatan').value.trim()};n.innerHTML='<div class="notice info">Mengirim ke server dan memverifikasi database…</div>';try{const r=await rpc('createTransaction',data);if(!r?.success||!r.id)throw Error('Server tidak mengembalikan ID transaksi.');n.innerHTML='<div class="notice success">✓ Tersimpan & diverifikasi · <b>'+esc(r.id)+'</b> · Saldo '+rupiah(r.dashboard.saldo)+'</div>';e.target.reset();setJenis('Pemasukan');setTimeout(boot,700)}catch(err){n.innerHTML='<div class="notice error"><b>Gagal menyimpan.</b><br>'+esc(err.message)+'<br><small>Transaksi belum dinyatakan tersimpan. Jangan klik ulang.</small></div>'}finally{b.disabled=false;b.textContent='💾 Simpan & Verifikasi'}}function openDetail(a){openModal(`<div class="modal-head"><div><h3>Detail ${esc(a.id)}</h3><div class="version">${esc(a.tanggal)} · ${esc(a.waktu)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Jenis</label><input value="${esc(a.jenis)}" disabled></div><div class="field"><label>Nominal</label><input value="${rupiah(a.nominal)}" disabled></div><div class="field full"><label>Keterangan</label><input value="${esc(a.keterangan)}" disabled></div><div class="field full"><label>Catatan</label><textarea disabled>${esc(a.catatan)}</textarea></div></div><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Tutup</button>${a.status==='AKTIF'?`<button class="btn btn-light" onclick='openEdit(${JSON.stringify(a)})'>✏️ Edit</button><button class="btn btn-red" onclick='openCancel(${JSON.stringify(a)})'>🚫 Batalkan</button>`:''}</div>`)}function openEdit(a){openModal(`<div class="modal-head"><h3>Edit Transaksi</h3><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Tanggal</label><input id="edTanggal" type="date" value="${esc(a.tanggal)}"></div><div class="field"><label>Waktu</label><input id="edWaktu" type="time" value="${esc(a.waktu)}"></div><div class="field"><label>Jenis</label><select id="edJenis"><option ${a.jenis==='Pemasukan'?'selected':''}>Pemasukan</option><option ${a.jenis==='Pengeluaran'?'selected':''}>Pengeluaran</option></select></div><div class="field"><label>Nominal</label><input id="edNominal" type="number" value="${a.nominal}"></div><div class="field full"><label>Kategori</label><input id="edKategori" value="${esc(a.kategori)}"></div><div class="field full"><label>Keterangan</label><input id="edKet" value="${esc(a.keterangan)}"></div><div class="field full"><label>Catatan</label><textarea id="edCatatan">${esc(a.catatan)}</textarea></div><div class="field full"><label>Password Admin</label><input id="edPass" type="password"></div><div class="field full"><label>Alasan Perubahan</label><input id="edReason" placeholder="Contoh: Salah nominal"></div></div><div id="modalNotice"></div><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-blue" onclick='doEdit("${esc(a.id)}")'>Simpan Perubahan</button></div>`)}async function doEdit(id){try{const r=await rpc('updateTransaction',{transactionId:id,password:$('edPass').value,reason:$('edReason').value,data:{tanggal:$('edTanggal').value,waktu:$('edWaktu').value,jenis:$('edJenis').value,nominal:Number($('edNominal').value),kategori:$('edKategori').value,keterangan:$('edKet').value,catatan:$('edCatatan').value}});if(!r?.success)throw Error('Perubahan gagal.');closeModal();boot()}catch(e){$('modalNotice').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}function openCancel(a){openModal(`<div class="modal-head"><h3>Batalkan Transaksi</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice info">Transaksi <b>${esc(a.id)}</b> tidak akan dihapus. Status akan menjadi <b>DIBATALKAN</b> dan saldo akan dihitung ulang.</div><div class="form-grid"><div class="field full"><label>Password Admin</label><input id="caPass" type="password"></div><div class="field full"><label>Alasan Pembatalan</label><textarea id="caReason" placeholder="Contoh: transaksi testing"></textarea></div></div><div id="modalNotice"></div><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-red" onclick='doCancel("${esc(a.id)}")'>Batalkan Transaksi</button></div>`)}async function doCancel(id){try{const r=await rpc('cancelTransaction',{transactionId:id,password:$('caPass').value,reason:$('caReason').value});if(!r?.success)throw Error('Pembatalan gagal.');closeModal();boot()}catch(e){$('modalNotice').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}async function shareWA(){try{const r=await rpc('reportSummary');const text=`LAPORAN KAS RT 01 RW 01\nDukuh Gudang, Desa Surorejan\nPer Tanggal: ${r.date}\n\nSaldo Awal: ${rupiah(r.saldoAwal)}\nTotal Pemasukan: ${rupiah(r.pemasukan)}\nTotal Pengeluaran: ${rupiah(r.pengeluaran)}\n-----------------------------------\nSISA SALDO SEKARANG: ${rupiah(r.saldo)}\n\nCatatan: Transaksi dicatat secara otomatis via Aplikasi Kas RT.`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}catch(e){alert(e.message)}}async function openReport(){try{const r=await rpc('reportSummary');openModal(`<div class="modal-head"><h3>Laporan Kas</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice success">${esc(r.nama_rt)} · ${esc(r.nama_rw)}</div><div class="cards" style="grid-template-columns:1fr 1fr"><div class="card stat"><div class="eyebrow">Saldo Awal</div><div class="value">${rupiah(r.saldoAwal)}</div></div><div class="card stat"><div class="eyebrow">Saldo Akhir</div><div class="value income">${rupiah(r.saldo)}</div></div><div class="card stat"><div class="eyebrow">Pemasukan</div><div class="value income">${rupiah(r.pemasukan)}</div></div><div class="card stat"><div class="eyebrow">Pengeluaran</div><div class="value expense">${rupiah(r.pengeluaran)}</div></div></div><div class="modal-actions"><button class="btn btn-green" onclick="shareWA()">🟢 WhatsApp</button><button class="btn btn-light" onclick="closeModal()">Tutup</button></div>`)}catch(e){alert(e.message)}}function openSettings(){openModal(`<div class="modal-head"><h3>Pengaturan</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice info">Pengaturan administrasi akan dilindungi password admin dan disimpan di server.</div><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Tutup</button></div>`)}boot();</script></body></html>
