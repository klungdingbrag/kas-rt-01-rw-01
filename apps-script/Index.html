<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kas RT 01 / RW 01</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#172033;color:white;border-radius:20px;padding:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e7eaf0;border-radius:16px;padding:20px}.balance{font-size:32px;font-weight:800}.muted{color:#667085;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:600}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dee8;border-radius:10px;font:inherit}textarea{min-height:80px}button{background:#172033;color:white;border:0;font-weight:700;cursor:pointer}.table{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.in{color:#087443}.out{color:#b42318}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf7ef;color:#087443;font-size:12px;font-weight:700}.notice{margin:12px 0;padding:10px;border-radius:10px;background:#eef6ff;color:#175cd3}.error{background:#fff1f0;color:#b42318}.success{background:#ecfdf3;color:#067647}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.wrap{padding:14px}.balance{font-size:26px}}</style></head><body><main class="wrap"><section class="hero"><div class="muted" style="color:#cbd5e1">ADMINISTRASI KEUANGAN</div><h1>Kas RT 01 / RW 01</h1><div>Dukuh Gudang · Desa Surorejan · Kecamatan Puring · Kabupaten Kebumen</div></section><div id="app"><div class="notice">Memuat data dari Google Sheets…</div></div></main><script>const $=id=>document.getElementById(id);let lastData=null;function call(name,arg){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(arg===undefined)runner[name]();else runner[name](arg)})}async function load(){try{lastData=await call('initialData');render(lastData)}catch(e){$('app').innerHTML='<div class="notice error"><b>Gagal memuat database.</b><br>'+escapeHtml(e.message||String(e))+'</div>'}}function render(d){const x=d.dashboard,t=d.transactions||[];$('app').innerHTML=`<section class="grid"><div class="card"><div class="muted">SALDO SAAT INI</div><div class="balance">Rp ${Number(x.saldo).toLocaleString('id-ID')}</div><div class="status">✓ Dihitung & dikonfirmasi server</div></div><div class="card"><div class="muted">TOTAL PEMASUKAN</div><div class="balance in" style="font-size:24px">Rp ${Number(x.pemasukan).toLocaleString('id-ID')}</div></div><div class="card"><div class="muted">TOTAL PENGELUARAN</div><div class="balance out" style="font-size:24px">Rp ${Number(x.pengeluaran).toLocaleString('id-ID')}</div></div></section><section class="card" style="margin-top:14px"><h2>Tambah Transaksi</h2><div id="saveNotice"></div><form class="form" onsubmit="save(event)"><label>Jenis<select id="jenis"><option>Pemasukan</option><option>Pengeluaran</option></select></label><label>Tanggal<input id="tanggal" type="date" required></label><label>Waktu<input id="waktu" type="time" required></label><label>Kategori<input id="kategori" value="Lainnya" required></label><label>Nominal<input id="nominal" type="number" min="1" step="1" required></label><label>Keterangan<input id="keterangan" required></label><label class="full">Catatan<textarea id="catatan"></textarea></label><div class="full"><button id="saveBtn">💾 Simpan ke Database</button></div></form></section><section class="card" style="margin-top:14px"><h2>Transaksi Aktif (${x.jumlahTransaksi})</h2><div class="table"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Status</th></tr></thead><tbody>${t.filter(a=>a.status==='AKTIF').map(a=>`<tr><td>${escapeHtml(a.id)}</td><td>${escapeHtml(a.tanggal)}</td><td>${escapeHtml(a.jenis)}</td><td>${escapeHtml(a.kategori)}</td><td>${escapeHtml(a.keterangan)}</td><td class="${a.jenis==='Pemasukan'?'in':'out'}">${a.jenis==='Pemasukan'?'+':'-'} Rp ${Number(a.nominal).toLocaleString('id-ID')}</td><td><span class="status">AKTIF</span></td></tr>`).join('')}</tbody></table></div></section>`;const now=new Date();$('tanggal').value=now.toISOString().slice(0,10);$('waktu').value=now.toTimeString().slice(0,5)}async function save(e){e.preventDefault();const b=$('saveBtn'),n=$('saveNotice');b.disabled=true;b.textContent='⏳ Menyimpan ke server…';n.innerHTML='<div class="notice">Transaksi sedang ditulis ke Google Sheets. Jangan tutup halaman.</div>';const data={tanggal:$('tanggal').value,waktu:$('waktu').value,jenis:$('jenis').value,kategori:$('kategori').value.trim(),nominal:Number($('nominal').value),keterangan:$('keterangan').value.trim(),catatan:$('catatan').value.trim()};try{const r=await call('createTransaction',data);if(!r||!r.success||!r.id)throw Error('Server menyimpan transaksi tetapi tidak memberikan konfirmasi ID. Jangan kirim ulang.');n.innerHTML='<div class="notice success">✓ Tersimpan & diverifikasi di database · <b>'+escapeHtml(r.id)+'</b></div>';await load()}catch(err){n.innerHTML='<div class="notice error"><b>Transaksi belum dinyatakan tersimpan.</b><br>'+escapeHtml(err.message||String(err))+'<br><small>Jangan kirim ulang sebelum database diperiksa.</small></div>'}finally{b.disabled=false;b.textContent='💾 Simpan ke Database'}}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
