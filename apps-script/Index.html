<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Kas RT 01 / RW 01</title>
  <style>
    /* =========================================================
       KAS RT 01 / RW 01 — UI
       UI build: 2026.08.20.10
       Struktur: Variables → Reset → Layout → Components → Mobile
       ========================================================= */
    :root {
      --navy:#0f172a;
      --navy-2:#1e293b;
      --blue:#2563eb;
      --green:#059669;
      --green-bg:#ecfdf5;
      --red:#dc2626;
      --red-bg:#fff1f2;
      --amber:#d97706;
      --bg:#f4f6f9;
      --card:#ffffff;
      --line:#e2e8f0;
      --text:#0f172a;
      --muted:#64748b;
      --shadow:0 8px 28px rgba(15,23,42,.07);
      --radius:18px;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }

    /* ---------- APP SHELL ---------- */
    .app { min-height:100vh; }
    .topbar {
      position:sticky;
      top:0;
      z-index:30;
      background:var(--navy);
      color:#fff;
      box-shadow:0 2px 16px rgba(0,0,0,.12);
    }
    .topbar-inner {
      max-width:1180px;
      margin:auto;
      padding:14px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .brand { display:flex; align-items:center; gap:11px; min-width:0; }
    .brand-icon {
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:#fff;
      color:var(--navy);
      font-weight:900;
      flex:0 0 auto;
    }
    .brand-title { font-size:16px; font-weight:800; margin:0; }
    .brand-subtitle { display:block; margin-top:2px; color:#cbd5e1; font-size:11px; }
    .server-status { display:flex; align-items:center; gap:7px; color:#cbd5e1; font-size:11px; white-space:nowrap; }
    .server-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; }
    .server-dot.error { background:#ef4444; }

    .container { max-width:1180px; margin:auto; padding:24px; }

    /* ---------- GENERIC ---------- */
    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .section { margin-top:18px; padding:21px; }
    .section-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }
    .section-title { margin:0; font-size:17px; }
    .section-subtitle { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; }
    .btn {
      border:0;
      border-radius:11px;
      padding:11px 15px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      font-weight:750;
      font-size:13px;
      transition:transform .12s,opacity .12s;
    }
    .btn:hover { transform:translateY(-1px); }
    .btn:disabled { opacity:.55; cursor:wait; transform:none; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-dark { background:var(--navy); color:#fff; }
    .btn-light { background:#fff; color:var(--text); border:1px solid var(--line); }
    .btn-green { background:var(--green); color:#fff; }
    .btn-red { background:var(--red-bg); color:#be123c; border:1px solid #fecdd3; }

    .notice { margin-top:12px; padding:12px 14px; border-radius:11px; font-size:13px; }
    .notice-info { background:#eff6ff; color:#1d4ed8; }
    .notice-success { background:var(--green-bg); color:#047857; }
    .notice-error { background:var(--red-bg); color:#be123c; }
    .hidden { display:none !important; }

    /* ---------- DASHBOARD ---------- */
    .hero {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      margin-bottom:18px;
    }
    .hero h1 { margin:0 0 5px; font-size:27px; letter-spacing:-.5px; }
    .hero p { margin:0; color:var(--muted); font-size:13px; }
    .summary-grid { display:grid; grid-template-columns:1.45fr 1fr 1fr; gap:13px; }
    .summary-card { padding:21px; }
    .balance-card {
      color:#fff;
      border:0;
      background:linear-gradient(135deg,var(--navy),var(--navy-2));
    }
    .eyebrow { color:#94a3b8; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .balance-amount { margin:8px 0; font-size:33px; font-weight:900; letter-spacing:-1px; }
    .verified { color:#bbf7d0; font-size:11px; }
    .stat-value { margin-top:8px; font-size:22px; font-weight:850; }
    .income { color:var(--green); }
    .expense { color:var(--red); }

    /* ---------- FORM ---------- */
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .field { min-width:0; }
    .field.full { grid-column:1 / -1; }
    .field label { display:block; margin-bottom:6px; font-size:12px; font-weight:750; color:#334155; }
    .field input,.field select,.field textarea {
      width:100%;
      border:1px solid #dbe2ea;
      border-radius:11px;
      padding:12px 13px;
      background:#fff;
      color:var(--text);
      outline:none;
    }
    .field input:focus,.field select:focus,.field textarea:focus {
      border-color:#93c5fd;
      box-shadow:0 0 0 3px #dbeafe;
    }
    .field textarea { min-height:80px; resize:vertical; }
    .segmented { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; background:#f1f5f9; border-radius:12px; }
    .segmented button { border:0; border-radius:9px; padding:10px; background:transparent; color:var(--muted); font-weight:800; }
    .segmented button.active-income { background:#dcfce7; color:#047857; }
    .segmented button.active-expense { background:#fee2e2; color:#b91c1c; }

    /* ---------- HISTORY ---------- */
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
    th { padding:10px 12px; text-align:left; color:var(--muted); background:#f8fafc; border-bottom:1px solid var(--line); font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
    td { padding:12px; border-bottom:1px solid #eef2f7; vertical-align:middle; white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    .pill { display:inline-flex; padding:5px 8px; border-radius:999px; font-size:10px; font-weight:800; }
    .pill-active { background:#dcfce7; color:#047857; }
    .pill-cancelled { background:#f1f5f9; color:#64748b; }
    .empty { padding:32px; text-align:center; color:var(--muted); }

    /* ---------- REPORT ---------- */
    .report-box { display:flex; flex-wrap:wrap; gap:9px; }
    .version { margin-top:12px; color:#94a3b8; font-size:10px; }

    /* ---------- MOBILE NAV ---------- */
    .bottom-nav {
      display:none;
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:40;
      grid-template-columns:repeat(4,1fr);
      padding:7px 6px calc(7px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.96);
      border-top:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .bottom-nav button { border:0; background:transparent; color:var(--muted); font-size:10px; font-weight:750; }
    .bottom-nav span { display:block; margin-bottom:2px; font-size:19px; }

    /* ---------- MOBILE ---------- */
    @media (max-width:760px) {
      body { padding-bottom:76px; }
      .topbar-inner { padding:12px 14px; }
      .server-status { display:none; }
      .brand-icon { width:38px; height:38px; }
      .brand-title { font-size:14px; }
      .brand-subtitle { font-size:10px; }
      .container { padding:14px; }
      .hero { display:block; }
      .hero h1 { font-size:23px; }
      .hero .actions { margin-top:13px; }
      .hero .actions .btn { flex:1; }
      .summary-grid { grid-template-columns:1fr 1fr; }
      .balance-card { grid-column:1 / -1; }
      .balance-amount { font-size:29px; }
      .summary-card { padding:16px; }
      .stat-value { font-size:18px; }
      .section { padding:16px; border-radius:16px; }
      .form-grid { grid-template-columns:1fr; }
      .field.full { grid-column:auto; }
      .section-header { align-items:flex-start; }
      .section-header .btn { padding:9px 11px; }
      .bottom-nav { display:grid; }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- =======================================================
         HEADER
         ======================================================= -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-icon">RT</div>
          <div>
            <div class="brand-title">Kas RT 01 / RW 01</div>
            <span class="brand-subtitle">Dukuh Gudang · Desa Surorejan</span>
          </div>
        </div>
        <div class="server-status">
          <span id="serverDot" class="server-dot"></span>
          <span id="serverStatus">Memeriksa server…</span>
        </div>
      </div>
    </header>

    <!-- =======================================================
         MAIN APPLICATION
         ======================================================= -->
    <main class="container">
      <div id="appRoot">
        <section class="card section">
          <b>Memuat aplikasi Kas RT…</b>
          <div class="version">UI build 2026.08.20.10</div>
        </section>
      </div>
    </main>

    <!-- =======================================================
         MOBILE NAVIGATION
         ======================================================= -->
    <nav class="bottom-nav" aria-label="Navigasi mobile">
      <button type="button" onclick="scrollToSection('dashboard')"><span>⌂</span>Beranda</button>
      <button type="button" onclick="scrollToSection('transactionForm')"><span>＋</span>Transaksi</button>
      <button type="button" onclick="scrollToSection('history')"><span>▤</span>Riwayat</button>
      <button type="button" onclick="scrollToSection('report')"><span>◫</span>Laporan</button>
    </nav>
  </div>

  <script>
    /* =========================================================
       KAS RT 01 / RW 01 — JAVASCRIPT
       Struktur: Constants → Helpers → Server RPC → Boot → UI
       ========================================================= */

    const UI_VERSION = '2026.08.20.10';
    let currentType = 'Pemasukan';
    let booting = false;

    /* ---------- DOM / HELPERS ---------- */
    function byId(id) { return document.getElementById(id); }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
        return {
          '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        }[char];
      });
    }

    function rupiah(value) {
      return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
    }

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function timeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    function scrollToSection(id) {
      const target = byId(id);
      if (target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    }

    function setServerState(ok, text) {
      byId('serverStatus').textContent = text;
      byId('serverDot').className = 'server-dot' + (ok ? '' : ' error');
    }

    function showNotice(type, message) {
      return '<div class="notice notice-' + type + '">' + message + '</div>';
    }

    /* ---------- GOOGLE APPS SCRIPT RPC ---------- */
    function serverCall(functionName) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        let finished = false;
        const timeout = setTimeout(function() {
          if (finished) return;
          finished = true;
          reject(new Error('Server timeout saat menjalankan ' + functionName + '.'));
        }, 20000);

        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          clearTimeout(timeout);
          reject(new Error('google.script.run tidak tersedia. Pastikan halaman dibuka dari Google Apps Script Web App, bukan file HTML lokal.'));
          return;
        }

        const runner = google.script.run
          .withSuccessHandler(function(result) {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            resolve(result);
          })
          .withFailureHandler(function(error) {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            reject(new Error(error && error.message ? error.message : String(error)));
          });

        runner[functionName].apply(runner, args);
      });
    }

    /* ---------- BOOT SEQUENCE ---------- */
    async function boot() {
      if (booting) return;
      booting = true;

      setServerState(true, 'Memeriksa server…');
      byId('appRoot').innerHTML =
        '<section class="card section">' +
          '<b>Memuat data kas dari Google Sheets…</b>' +
          '<div class="version">UI build ' + UI_VERSION + '</div>' +
        '</section>';

      try {
        // STEP 1 — Pastikan backend hidup.
        const health = await serverCall('testBackend');
        if (!health || health.success !== true) {
          throw new Error('Backend tidak memberikan status OK.');
        }
        setServerState(true, 'Database tersambung · Server ' + (health.version || 'OK'));

        // STEP 2 — Ambil seluruh state aplikasi dari server.
        const data = await serverCall('initialData');
        if (!data || data.success !== true || !data.dashboard) {
          throw new Error('initialData tidak mengembalikan data aplikasi yang valid.');
        }

        // STEP 3 — Render hanya setelah data valid.
        renderApplication(data);
      } catch (error) {
        setServerState(false, 'Server error');
        renderFatalError(error);
      } finally {
        booting = false;
      }
    }

    function renderFatalError(error) {
      const message = escapeHtml(error && error.message ? error.message : String(error));
      byId('appRoot').innerHTML =
        '<section class="card section">' +
          showNotice('error', '<b>Gagal memuat aplikasi</b><br>' + message) +
          '<div class="section-header">' +
            '<div><h2 class="section-title">Diagnostik</h2><span class="section-subtitle">UI tetap aktif agar masalah mudah dilacak.</span></div>' +
            '<button class="btn btn-light" type="button" onclick="boot()">↻ Coba Lagi</button>' +
          '</div>' +
          '<div class="version">UI build ' + UI_VERSION + '</div>' +
        '</section>';
    }

    /* ---------- RENDER ---------- */
    function renderApplication(data) {
      const dashboard = data.dashboard;
      const transactions = Array.isArray(data.transactions) ? data.transactions : [];

      const rows = transactions.length
        ? transactions.map(renderTransactionRow).join('')
        : '<tr><td colspan="8" class="empty">Belum ada transaksi.</td></tr>';

      byId('appRoot').innerHTML = `
        <section id="dashboard" class="hero">
          <div>
            <h1>Dashboard Kas</h1>
            <p>Administrasi kas RT yang terhubung langsung ke Google Sheets.</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" onclick="prepareTransaction('Pemasukan')">＋ Pemasukan</button>
            <button class="btn btn-light" type="button" onclick="prepareTransaction('Pengeluaran')">− Pengeluaran</button>
          </div>
        </section>

        <section class="summary-grid">
          <div class="card summary-card balance-card">
            <div class="eyebrow">Saldo Saat Ini</div>
            <div class="balance-amount">${rupiah(dashboard.saldo)}</div>
            <div class="verified">✓ Dihitung & dikonfirmasi server</div>
          </div>
          <div class="card summary-card">
            <div class="eyebrow">Total Pemasukan</div>
            <div class="stat-value income">${rupiah(dashboard.pemasukan)}</div>
          </div>
          <div class="card summary-card">
            <div class="eyebrow">Total Pengeluaran</div>
            <div class="stat-value expense">${rupiah(dashboard.pengeluaran)}</div>
          </div>
        </section>

        <section id="transactionForm" class="card section">
          <div class="section-header">
            <div>
              <h2 class="section-title">Tambah Transaksi</h2>
              <span class="section-subtitle">Simpan langsung ke database dan verifikasi ID dari server.</span>
            </div>
          </div>

          <form id="transactionFormElement" class="form-grid">
            <div class="field full">
              <label>Jenis Transaksi</label>
              <div class="segmented">
                <button id="incomeButton" type="button" onclick="setTransactionType('Pemasukan')">↑ Pemasukan</button>
                <button id="expenseButton" type="button" onclick="setTransactionType('Pengeluaran')">↓ Pengeluaran</button>
              </div>
            </div>

            <div class="field">
              <label for="dateInput">Tanggal</label>
              <input id="dateInput" type="date" required>
            </div>
            <div class="field">
              <label for="timeInput">Waktu</label>
              <input id="timeInput" type="time" required>
            </div>
            <div class="field">
              <label for="categoryInput">Kategori</label>
              <input id="categoryInput" value="Lainnya" required>
            </div>
            <div class="field">
              <label for="amountInput">Nominal</label>
              <input id="amountInput" type="number" min="1" step="1" placeholder="50000" required>
            </div>
            <div class="field full">
              <label for="descriptionInput">Keterangan</label>
              <input id="descriptionInput" placeholder="Contoh: Iuran warga bulan Agustus" required>
            </div>
            <div class="field full">
              <label for="noteInput">Catatan</label>
              <textarea id="noteInput" placeholder="Catatan tambahan (opsional)"></textarea>
            </div>
            <div class="field full">
              <button id="saveButton" class="btn btn-primary" type="submit" style="width:100%">💾 Simpan & Verifikasi</button>
            </div>
          </form>
          <div id="saveMessage"></div>
        </section>

        <section id="history" class="card section">
          <div class="section-header">
            <div>
              <h2 class="section-title">Riwayat Transaksi</h2>
              <span class="section-subtitle">${dashboard.jumlahTransaksi} transaksi aktif dari database.</span>
            </div>
            <button class="btn btn-light" type="button" onclick="boot()">↻ Refresh</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tanggal</th>
                  <th>Jenis</th>
                  <th>Kategori</th>
                  <th>Keterangan</th>
                  <th>Nominal</th>
                  <th>Status</th>
                  <th>Waktu</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>

        <section id="report" class="card section">
          <div class="section-header">
            <div>
              <h2 class="section-title">Laporan & Berbagi</h2>
              <span class="section-subtitle">Gunakan data yang dihitung ulang dari server.</span>
            </div>
          </div>
          <div class="report-box">
            <button class="btn btn-green" type="button" onclick="shareWhatsApp()">🟢 Share WhatsApp</button>
            <button class="btn btn-light" type="button" onclick="showReportSummary()">📄 Ringkasan</button>
          </div>
        </section>

        <div class="version">UI build ${UI_VERSION} · Data berasal dari server, bukan cache browser.</div>
      `;

      byId('dateInput').value = todayISO();
      byId('timeInput').value = timeHHMM();
      setTransactionType('Pemasukan');
      byId('transactionFormElement').addEventListener('submit', saveTransaction);
    }

    function renderTransactionRow(tx) {
      const incoming = tx.jenis === 'Pemasukan';
      const statusClass = tx.status === 'AKTIF' ? 'pill-active' : 'pill-cancelled';
      return '<tr>' +
        '<td><b>' + escapeHtml(tx.id) + '</b></td>' +
        '<td>' + escapeHtml(tx.tanggal) + '</td>' +
        '<td>' + (incoming ? '↑ Pemasukan' : '↓ Pengeluaran') + '</td>' +
        '<td>' + escapeHtml(tx.kategori) + '</td>' +
        '<td>' + escapeHtml(tx.keterangan) + '</td>' +
        '<td class="' + (incoming ? 'income' : 'expense') + '">' + (incoming ? '+' : '−') + ' ' + rupiah(tx.nominal) + '</td>' +
        '<td><span class="pill ' + statusClass + '">' + escapeHtml(tx.status) + '</span></td>' +
        '<td>' + escapeHtml(tx.waktu) + '</td>' +
      '</tr>';
    }

    /* ---------- TRANSACTION ---------- */
    function setTransactionType(type) {
      currentType = type;
      const incomeButton = byId('incomeButton');
      const expenseButton = byId('expenseButton');
      if (!incomeButton || !expenseButton) return;
      incomeButton.className = type === 'Pemasukan' ? 'active-income' : '';
      expenseButton.className = type === 'Pengeluaran' ? 'active-expense' : '';
    }

    function prepareTransaction(type) {
      setTransactionType(type);
      scrollToSection('transactionForm');
      const amount = byId('amountInput');
      if (amount) amount.focus();
    }

    async function saveTransaction(event) {
      event.preventDefault();

      const button = byId('saveButton');
      const message = byId('saveMessage');
      button.disabled = true;
      button.textContent = 'Menyimpan ke database…';
      message.innerHTML = showNotice('notice-info', 'Menyimpan transaksi dan menunggu verifikasi server…');

      const payload = {
        tanggal: byId('dateInput').value,
        waktu: byId('timeInput').value,
        jenis: currentType,
        kategori: byId('categoryInput').value.trim(),
        nominal: Number(byId('amountInput').value),
        keterangan: byId('descriptionInput').value.trim(),
        catatan: byId('noteInput').value.trim()
      };

      try {
        const result = await serverCall('createTransaction', payload);
        if (!result || result.success !== true || !result.id) {
          throw new Error('Server tidak mengembalikan ID transaksi baru.');
        }

        message.innerHTML = showNotice(
          'notice-success',
          '✓ Transaksi tersimpan: <b>' + escapeHtml(result.id) + '</b><br>Saldo terbaru: <b>' + rupiah(result.dashboard.saldo) + '</b>'
        );

        byId('amountInput').value = '';
        byId('descriptionInput').value = '';
        byId('noteInput').value = '';

        // Ambil ulang state dari server; tidak menggunakan cache lokal.
        setTimeout(boot, 500);
      } catch (error) {
        message.innerHTML = showNotice('notice-error', '<b>Transaksi belum dinyatakan tersimpan.</b><br>' + escapeHtml(error.message));
      } finally {
        button.disabled = false;
        button.textContent = '💾 Simpan & Verifikasi';
      }
    }

    /* ---------- REPORT / WHATSAPP ---------- */
    async function shareWhatsApp() {
      try {
        const report = await serverCall('reportSummary');
        const text =
          'LAPORAN KAS RT 01 RW 01\n' +
          'Dukuh Gudang, Desa Surorejan\n' +
          'Per Tanggal: ' + report.date + '\n\n' +
          'Saldo Awal: ' + rupiah(report.saldoAwal) + '\n' +
          'Total Pemasukan: ' + rupiah(report.pemasukan) + '\n' +
          'Total Pengeluaran: ' + rupiah(report.pengeluaran) + '\n' +
          '-----------------------------------\n' +
          'SISA SALDO SEKARANG: ' + rupiah(report.saldo) + '\n\n' +
          'Catatan: Transaksi dicatat secara otomatis via Aplikasi Kas RT.';
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');

    async function showReportSummary() {
      try {

        alert(
